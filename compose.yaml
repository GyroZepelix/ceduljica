services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      CEDULJICA_DB_PATH: /data/ceduljica.sqlite
    ports:
      - "${CEDULJICA_PORT:-3000}:3000"
    volumes:
      - ceduljica-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

volumes:
  ceduljica-data:
